name: Build and release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-apk-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore persistent APK signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/tendroid-debug.keystore
        run: |
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"

      - name: Test, lint, and build installable APK
        env:
          TENDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/tendroid-debug.keystore
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Name release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk tendroid-debug.apk

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" tendroid-debug.apk \
            --target "${GITHUB_SHA}" \
            --title "Tendroid build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated installable debug build from main (${GITHUB_SHA})." \
            --prerelease
